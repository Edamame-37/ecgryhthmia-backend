# Replace ecg.example.org and YOUR_PROJECT with staging/production values.
# TLS certificate installation and HTTPS readiness precede enabling HSTS.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=ecg_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ecg_auth:10m rate=1r/s;
server {
 listen 443 ssl;
 server_name ecg.example.org;
 ssl_certificate /etc/letsencrypt/live/ecg.example.org/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/ecg.example.org/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 server_tokens off;
 root /opt/ecgrhythmia-frontend/current;
 client_max_body_size 20m;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://lh3.googleusercontent.com; connect-src 'self' https://YOUR_PROJECT.supabase.co wss://YOUR_PROJECT.supabase.co; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
 location /api/ {
  limit_req zone=ecg_api burst=30 nodelay;
  proxy_pass http://127.0.0.1:8081;
  proxy_read_timeout 35s;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
 }
 location /api/auth/ {
  limit_req zone=ecg_auth burst=10 nodelay;
  proxy_pass http://127.0.0.1:8081;
 }
 location /uploads/ { proxy_pass http://127.0.0.1:8081; }
 location /ws {
  # Do not log the one-use ticket query string.
  access_log off;
  proxy_pass http://127.0.0.1:8080;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 45s;
  proxy_set_header Origin $http_origin;
 }
 location ~ /\. { deny all; }
 location = /index.html { expires -1; }
 location / { try_files $uri $uri/ /index.html; }
}
