# Install after certificates and the paired FE/BE release have passed staging.
# This file belongs in the Nginx http context (for example, sites-enabled).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=ecg_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ecg_auth:10m rate=1r/s;
server_tokens off;

server {
    listen 443 ssl;
    server_name ecgrhythmia.cloud www.ecgrhythmia.cloud;
    ssl_certificate /etc/letsencrypt/live/ecgrhythmia.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecgrhythmia.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/ecgrhythmia-frontend/current;
    index index.html;
    client_max_body_size 20m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://lh3.googleusercontent.com; connect-src 'self' https://api.ecgrhythmia.cloud wss://api.ecgrhythmia.cloud https://xzjxkplsgzcvdcjdhpcp.supabase.co wss://xzjxkplsgzcvdcjdhpcp.supabase.co; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    location /api/auth/ {
        limit_req zone=ecg_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 35s;
    }
    location /api/ {
        limit_req zone=ecg_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 35s;
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ~ /\. { deny all; }
    location = /index.html { expires -1; }
    location = /version.json { expires -1; }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 443 ssl;
    server_name api.ecgrhythmia.cloud;
    ssl_certificate /etc/letsencrypt/live/ecgrhythmia.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecgrhythmia.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /ws {
        # Tickets are single-use secrets. Never enable request/query access logs here.
        access_log off;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 45s;
        proxy_send_timeout 10s;
    }
    location /api/auth/ {
        limit_req zone=ecg_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 35s;
    }
    location / {
        limit_req zone=ecg_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 35s;
    }
}

server {
    listen 80;
    server_name ecgrhythmia.cloud www.ecgrhythmia.cloud api.ecgrhythmia.cloud;
    return 301 https://$host$request_uri;
}
