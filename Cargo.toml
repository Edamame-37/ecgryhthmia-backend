[package]
name = "ecg-backend"
version = "0.2.0"
edition = "2021"
default-run = "ecg-backend"
[lib]
name = "ecg_backend"
path = "src/lib.rs"
[dependencies]
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
rumqttc = { version = "0.25", default-features = false, features = ["use-native-tls"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
jsonwebtoken = { version = "10.3", features = ["aws_lc_rs"] }
dotenvy = "0.15"
tokio = { version = "1.53.3", features = ["full"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "timeout", "set-header"] }
tower = { version = "0.5", features = ["util", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
[dev-dependencies]
tempfile = "3"
aws-lc-rs = "1"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
[profile.release]
panic = "abort"
lto = true
strip = true
codegen-units = 1
