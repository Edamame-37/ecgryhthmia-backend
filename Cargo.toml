[package]
name = "ecg-backend"
version = "0.1.0"
edition = "2021"
description = "Backend WebSocket Medis untuk Streaming Data EKG Real-Time"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tungstenite = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
rumqttc = { version = "0.24", features = ["use-rustls"] }
rusqlite = { version = "0.29", features = ["bundled-sqlcipher"] }
chrono = "0.4"
base64 = "0.21"
jsonwebtoken = "9.3"
bcrypt = "0.15"
dotenvy = "0.15"

[profile.release]
panic = "abort"
lto = true
strip = true
codegen-units = 1